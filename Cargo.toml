[package]
name = "file-recovery"
version = "0.1.0"
edition = "2021"
description = "READ-ONLY file carving tool for macOS raw disks (APFS and other block devices)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
